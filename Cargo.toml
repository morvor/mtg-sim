[workspace]
resolver = "2"
members = ["crates/mtg-data", "crates/mtg-engine", "crates/mtg-sim", "crates/mtg-tools"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
flate2 = "1"
rand = "0.8"
rand_chacha = "0.3"
smallvec = { version = "1", features = ["serde", "union"] }
indexmap = "2"
once_cell = "1"
regex = "1"

# Card data is ~200 MB of JSON; keep loading fast even in debug/test builds.
[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.mtg-data]
opt-level = 3

[profile.release]
debug = 1
